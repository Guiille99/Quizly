<th:block th:fragment="quizList(quizzes)">
    <th:block th:replace="~{components/table/simple-skeleton :: base(
        thead=~{::thead},
        tbody=~{::tbody}
    )}">

        <thead>
            <tr>
                <th>Cuestionario</th>
                <th>Tema</th>
                <th>Dificultad</th>
                <th>Versión</th>
                <th>Última modificación</th>
                <th class="w-20 text-center">Acciones</th>
            </tr>
        </thead>

        <tbody class="text-xs">
            <tr th:if="${#lists.isEmpty(quizzes)}">
                <td colspan="6" class="text-center py-10 text-text-muted">Aún no existen cuestionarios para mostrar</td>
            </tr>

            <tr th:each="quiz : ${quizzes}">
                <!-- Título -->
                <td th:text="${quiz.titulo}"></td>
                <!-- Tema -->
                <td th:text="${quiz.tema ?: '-'}"></td>
                <!-- Dificultad -->
                <td>
                    <span class="badge-difficulty" th:classappend="${quiz.dificultad.codigo == 'EASY'}
                        ? ' badge-difficulty-easy'
                        : (${quiz.dificultad.codigo == 'MEDIUM'}
                            ? ' badge-difficulty-medium'
                            : ' badge-difficulty-hard')">
                    
                        <span th:text="${quiz.dificultad.nombre}"></span>
                    
                    </span>
                </td>
                <!-- Versión -->
                <td>
                    <div class="badge badge-muted" th:text="|v${quiz.version}|"></div>
                </td>
                <!-- Fecha de última actualización -->
                <td th:text="${quiz.fechaActualizacion}"></td>

                <!-- Acciones -->
                <td>
                    <div class="flex justify-center gap-1">
                        <a th:href="@{/admin/cuestionarios/{id}/editar(id=${quiz.id})}" class="btn btn-ghost btn-square btn-sm">
                            <i class="fa-regular fa-pen-to-square"></i>
                        </a>
                
                        <!-- <button class="btn btn-ghost btn-square btn-sm">
                            <i class="fa-solid fa-ellipsis"></i>
                        </button> -->
                    </div>
                </td>
            </tr>
        </tbody>

    </th:block>
</th:block>
