<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" th:replace="~{layout/base_layout :: layout(~{::main})}">
<head th:replace="~{fragments/head :: head('Quizly')}"></head>
<body>
    <main th:fragment="main" class="w-full px-6 py-8">
        <div class="mb-5">
            <h1 class="text-xl font-semibold tracking-tight text-text">Panel de administración de Quizly</h1>
            
            <p class="mt-1 text-sm text-text-muted ">
                <span th:text="${currentUser != null and currentUser.genero.codigo == 'F' ? 'Bienvenida' : 'Bienvenido'} + ', '"></span>
                <span th:if="${currentUser != null}" th:text="${currentUser.nombre}"></span>
            </p>
        </div>

        <!-- Estadísticas -->
        <div class="stats__container w-full mb-5">
            <div th:each="stat : ${dashboard.stats}" class="card stat-admin-card"
                th:classappend="'stat-admin-card--' + ${stat.color}">

                <div class="stat-admin-card__header">
                    <div class="stat-admin-card__title__container">
                        <div class="stat-admin-card__icon">
                            <i th:class="${stat.icono}"></i>
                        </div>
    
                        <span class="stat-admin-card__title" th:text="${stat.titulo}"></span>
                    </div>

                    <div th:if="${stat.tendencia != null}" class="stat-admin-card__trend"
                        th:classappend="'stat-admin-card__trend--' + ${#strings.toLowerCase(stat.tendencia.tipo.name())}">

                        <i th:class="${stat.tendencia.tipo.name() == 'POSITIVE'}
                            ? 'fa-solid fa-arrow-trend-up'
                            : (${stat.tendencia.tipo.name() == 'NEGATIVE'}
                                ? 'fa-solid fa-arrow-trend-down'
                                : 'fa-solid fa-minus')">
                        </i>

                        <span th:text="${stat.tendencia.valor}"></span>
                    </div>
                </div>

                <span class="stat-admin-card__value" th:text="${stat.valor}"></span>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
            <!-- Cuestionarios modificados recientemente -->
            <div class="col-span-2">
                <th:block th:replace="~{admin/fragments/quiz-list :: quizList(${dashboard.cuestionariosRecientes})}"></th:block> 
            </div>

            <!-- Actividad reciente -->
            <div class="card">
                <div class="card-body p-0">
                    <h3 class="card-title">Actividad reciente</h3>
                    <div class="flex flex-col gap-5">
            
                        <div th:if="${not #lists.isEmpty(actividades)}" th:each="actividad : ${actividades}"
                            class="flex items-start gap-3">
                            <div th:classappend="${actividad.bgColorClass} + ' ' + ${actividad.textColorClass}"
                                class="icon__container w-8 h-8">
                                <i th:if="${actividad.tipo == 'COMPLETADO'}" class="fa-solid fa-check"></i>
                                <i th:if="${actividad.tipo == 'RECORD'}" class="fa-solid fa-trophy"></i>
                                <i th:if="${actividad.tipo == 'INICIADO'}" class="fa-solid fa-play"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <p class="text-sm font-medium text-text truncate" th:text="${actividad.titulo}"></p>
                                <p class="text-xs text-text-muted" th:text="${actividad.subtitulo}"></p>
                            </div>
                            <span class="text-[10px] font-bold text-text-muted uppercase whitespace-nowrap pt-1"
                                th:text="${actividad.fechaRelativa}"></span>
                        </div>
            
                        <div th:if="${#lists.isEmpty(actividades)}">
                            <p class="text-text-muted">No hay atividades recientes que mostrar</p>
                        </div>
                    </div>
            
                </div>
            </div>

        </div>
    </main>
</body>
</html>
