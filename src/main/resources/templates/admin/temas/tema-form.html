<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" th:replace="~{layout/base_layout :: layout(~{::main})}">
<head th:replace="~{fragments/head :: head('Quizly')}"></head>
<body>
    <main th:fragment="main" class="w-full px-6 py-8">
        <div class="mb-5">
            <h1 class="text-xl font-semibold tracking-tight text-text"
                th:text="${temaForm.id == null ? 'Nuevo tema': 'Editar tema'}">
            </h1>
        </div>

        <form id="tema-form" class="form-stack"
            th:action="${temaForm.id == null ? '/admin/temas/nuevo' : '/admin/temas/' + temaForm.id + '/editar'}" 
            method="post" th:object="${temaForm}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <section class="card">
                <div class="card-body">
                    <div class="form-stack">
                        <!-- Nombre -->
                        <fieldset class="fieldset p-0">
                            <label for="nombre" class="label">
                                <span>
                                    Nombre
                                    <span class="text-error" aria-hidden="true">*</span>
                                </span>
                            </label>

                            <input type="text" class="input w-full" th:field="*{nombre}"
                                maxlength="100"
                                placeholder="Nombre del cuestionario"
                                th:classappend="${#fields.hasErrors('nombre')} ? 'input-error'"
                                th:readonly="${!temaForm.editable}">

                                <p th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="text-error"></p>
                        </fieldset>

                        <div class="flex flex-col md:flex-row gap-4">
                            <!-- Nº tema -->
                            <fieldset class="fieldset p-0 w-full md:w-5/12 lg:w-3/12">
                                <label for="orden" class="label">
                                    <span>
                                        Nº tema
                                        <span class="text-error" aria-hidden="true">*</span>
                                    </span>
                                </label>
    
                                <input type="number" name="orden" class="input" th:field="*{orden}"
                                    min="0" max="300"
                                    placeholder="Número del tema"
                                    th:classappend="${#fields.hasErrors('orden')} ? 'input-error'"
                                    th:readonly="${!temaForm.editable}">

                                <p th:if="${#fields.hasErrors('orden')}" th:errors="*{orden}" class="text-error"></p>
                            </fieldset>
    
                            <!-- Asignatura -->
                             <fieldset class="fieldset p-0">
                                 <label for="asignatura" class="label">
                                     <span>
                                         Asignatura
                                         <span class="text-error" aria-hidden="true">*</span>
                                     </span>
                                 </label>
         
                                 <select id="asignaturaSelect" class="select" th:field="*{asignaturaId}"
                                     th:classappend="${#fields.hasErrors('asignaturaId')} ? 'input-error'"
                                     th:readonly="${!temaForm.editable}">
         
                                     <option value="">Seleccione una asignatura</option>
         
                                     <option th:each="asignatura : ${asignaturas}"
                                         th:value="${asignatura.id}"
                                         th:text="${asignatura.nombre}">
                                     </option>
                                 </select>

                                 <p th:if="${#fields.hasErrors('asignaturaId')}" th:errors="*{asignaturaId}" class="text-error"></p>
                             </fieldset>
                        </div>

                        <fieldset class="fieldset p-0">
                            <label for="descripcion" class="label">
                                <span>
                                    Descripción
                                </span>
                            </label>

                            <textarea name="descripcion" class="textarea w-full"
                                placeholder="Breve descripción del tema"
                                th:field="*{descripcion}"
                                th:classappend="${#fields.hasErrors('descripcion')} ? 'input-error'"
                                th:readonly="${!temaForm.editable}"
                                maxlength="255">
                            </textarea>
                            <p th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}" class="text-error"></p>
                        </fieldset>
                    </div>
                </div>
            </section>

            <div class="flex items-center justify-end gap-2 mt-6">
                <a th:href="@{/admin/temas}" class="btn btn-outline"
                    th:text="${temaForm.editable ? 'Cancelar' : 'Volver'}"></a>
    
                <button th:if="${temaForm.editable}" type="submit" form="tema-form"
                    class="btn btn-primary" data-loading-text="Guardando...">
                    <i class="fa-regular fa-floppy-disk"></i>
                    <span th:text="${temaForm.id == null ? 'Crear tema' : 'Guardar cambios'}"></span> 
                </button>
            </div>
        </form>
    </main>
</body>
</html>
