<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" th:replace="~{layout/base_layout :: layout(~{::main})}">
<head th:replace="~{fragments/head :: head('Quizly')}"></head>
<body>
    <main th:fragment="main" class="w-full px-6 py-8">
        <!-- Cabecera -->
        <div class="flex flex-wrap gap-3 lg:gap-0 items-start justify-between mb-5">
            <div>
                <h1 class="text-xl font-semibold tracking-tight text-text">Gestión de cuestionarios</h1>
                
                <p class="mt-1 text-sm text-text-muted ">
                    Visualiza, crea, edita y gestiona todos los cuestionarios disponibles en el sistema.
                </p>
            </div>

            <a th:href="@{/admin/cuestionarios/nuevo}" class="btn btn-primary">
                <i class="fa-solid fa-plus"></i>
                Nuevo cuestionario
            </a>
        </div>

        <!-- Contenedor -->
         <div class="card mt-6">
            <div id="table-cuestionarios-container" class="card-body" th:fragment="table-cuestionarios-container_fragment">
                <!-- Filtros -->
                <form id="quiz-filter-form" class="flex gap-2">
                    <!-- Buscador -->
                    <input type="text" name="search" th:value="${filters.search}"
                        placeholder="Buscar cuestionario..." class="input"
                        hx-get="/admin/cuestionarios/tableData"
                        hx-trigger="input changed delay:400ms"
                        hx-target="#table-cuestionarios"
                        hx-include="#quiz-filter-form"
                        hx-swap="outerHTML">

                    <!-- Asignatura -->
                    <select name="asignaturaId" class="select"
                        hx-get="/admin/cuestionarios/tableData"
                        hx-trigger="change"
                        hx-target="#table-cuestionarios"
                        hx-include="#quiz-filter-form">
                    
                        <option value="">Todas las asignaturas</option>

                        <option th:each="asignatura : ${asignaturas}"
                            th:value="${asignatura.id}"
                            th:selected="${filters.asignaturaId == asignatura.id}"
                            th:text="${asignatura.nombre}">
                        </option>
                    </select>

                    <!-- Tema -->
                    <div class="contents" hx-get="/admin/cuestionarios/opcionesTemaFiltro"
                        hx-trigger="actualizarOpcionesTema from:body"
                        hx-target="this"
                        hx-include="#quiz-filter-form">

                        <select name="temaId" class="select"
                            th:disabled="${filters.asignaturaId == null}"
                            hx-get="/admin/cuestionarios/tableData"
                            hx-trigger="change"
                            hx-target="#table-cuestionarios"
                            hx-include="#quiz-filter-form"
                            th:fragment="opciones-temas-filtro_fragment">
    
                            <option value="" selected>Todos los temas</option>
    
                            <option th:each="tema : ${temas}"
                                th:value="${tema.id}"
                                th:selected="${filters.temaId == tema.id}"
                                th:text="${tema.nombre}">
                            </option>
                        </select>
                    </div>

                    <button name="resetFilters" class="btn btn-outline btn-error"
                        hx-get="/admin/cuestionarios/tableData"
                        hx-target="#table-cuestionarios-container"
                        hx-swap="outerHTML">

                        <i class="fa-solid fa-trash-can"></i>
                        Limpiar
                    </button>
                </form>

                <!-- Tabla -->
                <div th:replace="~{components/table/skeleton :: base(
                        tableId='table-cuestionarios', 
                        page=${cuestionariosPage}, 
                        thead=~{::thead}, 
                        tbody=~{::tbody}, 
                        filterFormId='#quiz-filter-form', 
                        targetUrl=@{/admin/cuestionarios/tableData},
                        pageParamName='page',
                        sizeOptions=${ {5, 10, 20, 50} })}" th:fragment="table-cuestionarios_fragment">
                
                    <thead>
                        <tr>
                            <th
                                th:replace="~{components/table/sort-header :: cell(
                                    field='titulo', 
                                    fieldLabel='Nombre', 
                                    page=${cuestionariosPage}, 
                                    filterFormId='#quiz-filter-form', 
                                    targetUrl=@{/admin/cuestionarios/tableData}, 
                                    tableId='table-cuestionarios', 
                                    pageParamName='page')}">
                            </th>
                            <th
                                th:replace="~{components/table/sort-header :: cell(
                                    field='asignatura', 
                                    fieldLabel='Asignatura', 
                                    page=${cuestionariosPage}, 
                                    filterFormId='#quiz-filter-form', 
                                    targetUrl=@{/admin/cuestionarios/tableData}, 
                                    tableId='table-cuestionarios', 
                                    pageParamName='page')}">
                            </th>
                            <th
                                th:replace="~{components/table/sort-header :: cell(
                                    field='tema', 
                                    fieldLabel='Tema', 
                                    page=${cuestionariosPage}, 
                                    filterFormId='#quiz-filter-form', 
                                    targetUrl=@{/admin/cuestionarios/tableData}, 
                                    tableId='table-cuestionarios', 
                                    pageParamName='page')}">
                            </th>
                            <th>Preguntas</th>
                            <th>Dificultad</th>
                            <th>Tiempo Límite</th>
                            <th>Versión</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                
                    <tbody>
                        <tr th:each="cuestionario : ${cuestionariosPage.content}">
                            <!-- Título -->
                            <td th:text="${cuestionario.titulo}"></td>
                            <!-- Asignatura -->
                            <td th:text="${cuestionario.asignatura}"></td>
                            <!-- Tema -->
                            <td th:text="${cuestionario.tema}"></td>
                            <!-- Preguntas -->
                            <td th:text="${cuestionario.numeroPreguntas}"></td>
                            <!-- Dificultad -->
                            <td>
                                <span class="badge-difficulty" th:classappend="${cuestionario.dificultad.codigo == 'EASY'}
                                    ? ' badge-difficulty-easy'
                                    : (${cuestionario.dificultad.codigo == 'MEDIUM'}
                                        ? ' badge-difficulty-medium'
                                        : ' badge-difficulty-hard')">
                            
                                    <span th:text="${cuestionario.dificultad.nombre}"></span>
                            
                                </span>
                            </td>
                            <!-- Tiempo límite -->
                            <td th:text="${cuestionario.tiempoLimite}"></td>
                            <!-- Versión -->
                            <td>
                                <div class="badge badge-muted" th:text="|v${cuestionario.version}|"></div>
                            </td>
                            <!-- Acciones -->
                            <td>
                                <div class="flex justify-center gap-1">
                                    <!-- Editar -->
                                    <a th:href="@{/admin/cuestionarios/{id}/editar(id=${cuestionario.id})}" 
                                        class="btn btn-ghost btn-square btn-sm">

                                        <i class="fa-regular" 
                                            th:classappend="${cuestionario.ultimaVersion ? 'fa-pen-to-square' : 'fa-eye'}"></i>
                                    </a>
                            
                                    <!-- Más acciones -->
                                    <button class="btn btn-ghost btn-square btn-sm">
                                        <i class="fa-solid fa-ellipsis"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </div>
            </div>
         </div>
    </main>
</body>
</html>
