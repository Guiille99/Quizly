<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" th:replace="~{layout/base_layout :: layout(~{::main})}">
<head th:replace="~{fragments/head :: head('Quizly - Usuarios')}"></head>
<body>
    <main th:fragment="main" class="w-full px-6 py-8">
        <div class="mb-5">
            <h1 class="text-xl font-semibold tracking-tight text-text"
                th:text="${usuarioForm.id == null ? 'Nuevo usuario': 'Editar usuario'}">
            </h1>
        </div>

        <form id="usuario-form" class="form-stack"
            th:action="${usuarioForm.id == null ? '/admin/usuarios/nuevo' : '/admin/usuarios/' + usuarioForm.id + '/editar'}" 
            method="post" th:object="${usuarioForm}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            
            <!-- Por si usas IDs ocultos -->
            <input type="hidden" th:field="*{id}">

            <section class="card">
                <div class="card-body">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        
                        <!-- Nombre -->
                        <fieldset class="fieldset p-0">
                            <label for="nombre" class="label">Nombre <span class="text-error">*</span></label>
                            <input type="text" class="input w-full" th:field="*{nombre}"
                                maxlength="255" placeholder="Ej. Juan"
                                th:classappend="${#fields.hasErrors('nombre')} ? 'input-error'">
                            <p th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="text-error"></p>
                        </fieldset>

                        <!-- Apellidos -->
                        <fieldset class="fieldset p-0">
                            <label for="apellidos" class="label">Apellidos <span class="text-error">*</span></label>
                            <input type="text" class="input w-full" th:field="*{apellidos}"
                                maxlength="255" placeholder="Ej. Pérez Gómez"
                                th:classappend="${#fields.hasErrors('apellidos')} ? 'input-error'">
                            <p th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}" class="text-error"></p>
                        </fieldset>

                        <!-- Username -->
                        <fieldset class="fieldset p-0">
                            <label for="username" class="label">Nombre de usuario <span class="text-error">*</span></label>
                            <input type="text" class="input w-full" th:field="*{username}"
                                maxlength="50" placeholder="Ej. juanperez"
                                th:classappend="${#fields.hasErrors('username')} ? 'input-error'">
                            <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-error"></p>
                        </fieldset>

                        <!-- Email -->
                        <fieldset class="fieldset p-0">
                            <label for="email" class="label">Correo electrónico <span class="text-error">*</span></label>
                            <input type="email" class="input w-full" th:field="*{email}"
                                maxlength="100" placeholder="juan@ejemplo.com"
                                th:classappend="${#fields.hasErrors('email')} ? 'input-error'">
                            <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-error"></p>
                        </fieldset>

                        <!-- Rol -->
                        <fieldset class="fieldset p-0">
                            <label for="rol" class="label">Rol <span class="text-error">*</span></label>
                            <select class="select w-full" th:field="*{rol}" th:classappend="${#fields.hasErrors('rol')} ? 'select-error'">
                                <option value="" disabled>Selecciona un rol</option>
                                <option th:each="rolOpt : ${rolesDisponibles}" 
                                        th:value="${rolOpt}" 
                                        th:text="${rolOpt.name()}">
                                </option>
                            </select>
                            <p th:if="${#fields.hasErrors('rol')}" th:errors="*{rol}" class="text-error"></p>
                        </fieldset>

                        <!-- Género -->
                        <fieldset class="fieldset p-0">
                            <label for="generoId" class="label">Género</label>
                            <select class="select w-full" th:field="*{generoId}" th:classappend="${#fields.hasErrors('generoId')} ? 'select-error'">
                                <option value="">No especificar</option>
                                <option th:each="g : ${generos}" 
                                        th:value="${g.id}" 
                                        th:text="${g.nombre}">
                                </option>
                            </select>
                            <p th:if="${#fields.hasErrors('generoId')}" th:errors="*{generoId}" class="text-error"></p>
                        </fieldset>

                        <!-- Password -->
                        <fieldset class="fieldset p-0 md:col-span-2">
                            <label for="password" class="label">
                                Contraseña 
                                <span th:if="${usuarioForm.id == null}" class="text-error">*</span>
                                <span th:if="${usuarioForm.id != null}" class="text-xs text-base-content/60 font-normal">(Dejar en blanco para mantener la actual)</span>
                            </label>
                            <input type="password" class="input w-full" th:field="*{password}"
                                placeholder="********"
                                th:classappend="${#fields.hasErrors('password')} ? 'input-error'">
                            <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-error"></p>
                        </fieldset>

                    </div>
                </div>
            </section>

            <div class="flex items-center justify-end gap-2 mt-6">
                <a th:href="@{/admin/usuarios}" class="btn btn-outline">Cancelar</a>
                <button type="submit" form="usuario-form" class="btn btn-primary"
                    data-loading-text="Guardando...">
                    <i class="fa-regular fa-floppy-disk"></i>
                    <span th:text="${usuarioForm.id == null ? 'Crear usuario' : 'Guardar cambios'}"></span> 
                </button>
            </div>
        </form>
    </main>
</body>
</html>
