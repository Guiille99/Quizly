<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" th:replace="~{layout/base_layout :: layout(~{::main})}">
<head th:replace="~{fragments/head :: head('Quizly')}"></head>
<body>
    <main th:fragment="main" class="w-full px-6 py-8">
        <div class="mb-5">
            <h1 class="text-xl font-semibold tracking-tight text-text">
                Asignaturas
            </h1>
            <p class="mt-1 text-sm text-text-muted">Explora las asignaturas disponibles y sus temas</p>
        </div>

        <form id="form-filtros-asignaturas" class="flex justify-between gap-4 mb-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        
            <fieldset class="fieldset p-0 flex-1">
                <input class="input w-full" type="search" id="nameFilter" name="nameFilter"
                    placeholder="Nombre de la asignatura"
                    hx-get="/asignaturas/elementos"
                    hx-trigger="input changed delay:400ms, search"
                    hx-target="#lista-asignaturas"
                    hx-include="#form-filtros-asignaturas" />
            </fieldset>

            <button class="btn btn-neutral" type="button" onclick="document.getElementById('form-filtros-asignaturas').reset()"
                hx-get="/asignaturas/elementos"
                hx-target="#lista-asignaturas"
                hx-swap="outerHTML">
                Limpiar
            </button>
        </form>

        <!-- Contenedor de asignaturas -->
        <div id="lista-asignaturas" th:fragment="lista-asignaturas_fragment">
            <th:block th:if="${asignaturas.totalElements > 0}">
                <div class="grid-cards-container mb-4">
                    <div th:each="item : ${asignaturas}" class="card selectable-card progress-card">
                        <a th:href="@{/asignaturas/{slug}(slug=${item.asignatura.slug})}" class="absolute top-0 left-0 z-999 h-full w-full"></a>
                        <div class="progress-card__header">
                            <div class="flex flex-col">
                                <span class="progress-card__name" th:text="${item.asignatura.nombre}">Matemáticas</span>
                                <span class="progress-card__info" th:text="|${item.nTemas} temas - Clic para ver|">8 temas - Clic para ver</span>
                            </div>
                        </div>
        
                        <progress class="progress auto-range" th:value="${item.porcentaje}" max="100"></progress>
                        <span class="progress-card__footer" th:text="|${item.porcentaje}% completado|">60% completado</span>
                    </div>
                </div>
    
                <div th:if="${asignaturas.totalPages > 0}">
                    <div th:replace="~{components/commons/pagination :: controls(
                        page=${asignaturas},
                        filterFormId='form-filtros-asignaturas',
                        targetUrl='/asignaturas/elementos',
                        tableId='lista-asignaturas',
                        pageParamName='page',
                        sizeOptions=${ {5, 10, 15, 20} }
                    )}">
    
                    </div>
                </div>
            </th:block>

            <div th:unless="${asignaturas.totalElements > 0}" class="w-full flex flex-col items-center justify-center py-16 px-4">
                <p>No se encontraron resultados</p>
            </div>
        </div>
    </main>
</body>
</html>
