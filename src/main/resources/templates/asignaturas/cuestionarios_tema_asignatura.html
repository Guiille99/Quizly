<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" th:replace="~{layout/base_layout :: layout(~{::main})}">
<head th:replace="~{fragments/head :: head('Quizly')}"></head>
<body>
    <main th:fragment="main" class="w-full px-6 py-8">
        <div class="mb-5">
            <h1 class="text-xl font-semibold tracking-tight text-text" th:text="${tema.nombre}"></h1>
            <p class="mt-1 text-sm text-text-muted">Explora los cuestionarios disponibles de este tema</p>
        </div>

        <!-- Filtro de los cuestionarios -->
        <form id="form-filtros-cuestionarios" class="flex justify-between gap-4 mb-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        
            <fieldset class="fieldset p-0 flex-1">
                <input class="input w-full" type="search" id="titleFilter" name="titleFilter"
                    placeholder="Título del cuestionario"
                    th:hx-get="@{/asignaturas/{slugAsig}/{slugTema}/tableData(slugAsig=${asignatura.slug}, slugTema=${tema.slug})}"
                    hx-trigger="input changed delay:400ms, search"
                    hx-target="#lista-cuestionarios"
                    hx-include="#form-filtros-cuestionarios" />
            </fieldset>
    
            <button class="btn btn-neutral" type="button" onclick="document.getElementById('form-filtros-cuestionarios').reset()"
                th:hx-get="@{/asignaturas/{slugAsig}/{slugTema}/tableData(slugAsig=${asignatura.slug}, slugTema=${tema.slug})}"
                hx-target="#lista-cuestionarios"
                hx-swap="outerHTML">
                Limpiar
            </button>
        </form>
    
    
        <!-- Contenedor de los cuestionarios del tema -->
        <div id="lista-cuestionarios" th:fragment="lista-cuestionarios_fragment">
            <th:block th:if="${cuestionariosTemaPage.totalElements > 0}">
                <div class="quiz__container flex flex-col gap-2 mb-4">
                    <div th:each="cuestionario : ${cuestionariosTemaPage}" class="card selectable-card quiz-card">
                        <div class="flex flex-col gap-1">
                            <span class="quiz-title" th:text="${cuestionario.titulo}"></span>
                            <span class="quiz-meta" th:text="|${cuestionario.tema.asignatura.nombre} - ${cuestionario.preguntas.size()} preguntas|"></span>
                        </div>
                        <div class="badge-difficulty" th:classappend="${cuestionario.dificultad.codigo == 'EASY' ? 'badge-difficulty-easy' : cuestionario.dificultad.codigo == 'MEDIUM' ? 'badge-difficulty-medium' : cuestionario.dificultad.codigo == 'HARD' ? 'badge-difficulty-hard' : ''}">
                            <span th:text="${cuestionario.dificultad.nombre}"></span>
                        </div>
        
                        <a class="btn btn-primary" th:href="@{/cuestionarios/{slug}(slug=${cuestionario.slug})}" role="button">Empezar</a>
                    </div>
                </div>
        
                <div th:if="${cuestionariosTemaPage.totalPages > 0}">
                    <div th:replace="~{components/commons/pagination :: controls(
                        page=${cuestionariosTemaPage},
                        filterFormId='form-filtros-cuestionarios',
                        targetUrl='/asignaturas/{slugAsig}/{slugTema}(slugAsig=${asignatura.slug}, slugTema=${tema.slug})',
                        tableId='lista-cuestionarios',
                        pageParamName='page',
                        sizeOptions=${ {5, 10, 15, 20} }
                    )}">
        
                    </div>
                </div>
            </th:block>

            <div th:unless="${cuestionariosTemaPage.totalElements > 0}" class="w-full flex flex-col items-center justify-center py-16 px-4">
                <p>No se encontraron resultados</p>
            </div>
        </div>
    </main>

</body>
</html>
