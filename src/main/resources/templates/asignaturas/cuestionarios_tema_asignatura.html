<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" th:replace="~{layout/base_layout :: layout(~{::main})}">
<head th:replace="~{fragments/head :: head('Quizly')}"></head>
<body>
    <main th:fragment="main" class="w-full px-6 py-8">
        <div class="mb-5">
            <h1 class="text-xl font-semibold tracking-tight text-text" th:text="${tema.nombre}"></h1>
            <p class="mt-1 text-sm text-text-muted">Explora los cuestionarios disponibles de este tema</p>
        </div>

        <!-- Filtros combinados: Búsqueda y Dificultad -->
        <div th:replace="~{components/quiz/quiz-filters :: filters(formId='quiz-filter-form', targetUrl=@{/asignaturas/{slugAsig}/{slugTema}/tableData(slugAsig=${asignatura.slug}, slugTema=${tema.slug})}, targetId='#lista-cuestionarios')}"></div>

        <!-- Contenedor de los cuestionarios del tema -->
        <div id="lista-cuestionarios" class="relative" hx-indicator="#lista-cuestionarios-loading"
            th:fragment="lista-cuestionarios_fragment">
            <div th:replace="~{components/commons/loading-overlay :: overlay('lista-cuestionarios-loading')}"></div>
            <!-- Estado vacío -->
            <div th:if="${cuestionariosTemaPage.empty}" class="flex flex-col items-center justify-center py-16 text-center">
                <div class="w-16 h-16 rounded-2xl bg-surface-alt flex items-center justify-center mb-4">
                    <i class="fa-solid fa-book-open text-2xl text-text-muted"></i>
                </div>
                <h3 class="font-semibold text-text">No se encontraron cuestionarios</h3>
                <p class="text-sm text-text-muted mt-1 max-w-xs">No hay cuestionarios que coincidan con los filtros seleccionados.</p>
            </div>

            <!-- Tarjetas -->
            <div th:if="${!cuestionariosTemaPage.empty}" class="quiz__container flex flex-col gap-2 mb-4">
                <th:block th:each="cuestionario : ${cuestionariosTemaPage}">
                    <div th:replace="~{components/quiz/quiz-card :: card(cuestionario=${cuestionario}, showActions=false, filterFormId='quiz-filter-form')}"></div>
                </th:block>
            </div>

            <!-- Paginación -->
            <div th:if="${cuestionariosTemaPage.totalPages > 1}">
                <div th:replace="~{components/commons/pagination :: controls(
                    page=${cuestionariosTemaPage},
                    filterFormId='quiz-filter-form',
                    targetUrl=@{/asignaturas/{slugAsig}/{slugTema}(slugAsig=${asignatura.slug}, slugTema=${tema.slug})},
                    tableId='lista-cuestionarios',
                    pageParamName='page',
                    sizeOptions=${ {5, 10, 15, 20} }
                )}">
                </div>
            </div>
        </div>
    </main>

</body>
</html>
