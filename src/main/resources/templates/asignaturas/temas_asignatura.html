<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" th:replace="~{layout/base_layout :: layout(~{::main})}">
<head th:replace="~{fragments/head :: head('Quizly')}"></head>
<body>
    <main th:fragment="main" class="w-full px-6 py-8">
        <div class="mb-5">
            <h1 class="text-xl font-semibold tracking-tight text-text" th:text="${asignatura.nombre}"></h1>
            <p class="mt-1 text-sm text-text-muted">Explora los temas disponibles de esta asignatura y su progreso</p>
        </div>

        <!-- Filtro de los temas -->
        <form id="form-filtros-temas" class="flex justify-between gap-4 mb-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        
            <fieldset class="fieldset p-0 flex-1">
                <input class="input w-full" type="search" id="nameFilter" name="nameFilter"
                    placeholder="Nombre del tema"
                    th:hx-get="@{/asignaturas/{slug}/tableData(slug=${asignatura.slug})}"
                    hx-trigger="input changed delay:400ms, search"
                    hx-target="#lista-temas"
                    hx-swap="outerHTML"
                    hx-include="#form-filtros-temas" />
            </fieldset>

            <button class="btn btn-neutral" type="button" onclick="document.getElementById('form-filtros-temas').reset()"
                th:hx-get="@{/asignaturas/{slug}/tableData(slug=${asignatura.slug})}"
                hx-target="#lista-temas"
                hx-swap="outerHTML">
                Limpiar
            </button>
        </form>


        <!-- Contenedor de temas de la asignatura -->
        <div id="lista-temas" th:fragment="lista-temas_fragment">
            <th:block th:if="${temasAsignatura.totalElements > 0}">
                <div class="grid-cards-container mb-4">
                    <div th:each="temaProgreso : ${temasAsignatura}" class="card selectable-card progress-card">
                        <a th:href="@{/asignaturas/{slugAsig}/{slugTema}(slugAsig=${asignatura.slug}, slugTema=${temaProgreso.tema.slug})}" class="absolute top-0 left-0 z-999 h-full w-full"></a>
                        <div class="progress-card__header">
                            <div class="flex flex-col">
                                <span class="progress-card__name" th:text="${temaProgreso.tema.nombre}"></span>
                                <span class="progress-card__info" th:text="|${temaProgreso.tema.cuestionarios.size()} cuestionarios - Clic para ver|"></span>
                            </div>
                        </div>
        
                        <progress class="progress auto-range" th:value="${temaProgreso.porcentaje}" max="100"></progress>
                        <span class="progress-card__footer" th:text="|${temaProgreso.porcentaje}% completado|"></span>
                    </div>
                </div>
    
                <div th:if="${temasAsignatura.totalPages > 0}">
                    <div th:replace="~{components/commons/pagination :: controls(
                        page=${temasAsignatura},
                        filterFormId='form-filtros-temas',
                        targetUrl='/asignaturas/{slug}/tableData(slug=${asignatura.slug})',
                        tableId='lista-temas',
                        pageParamName='page',
                        sizeOptions=${ {5, 10, 15, 20} }
                    )}">
    
                    </div>
                </div>
            </th:block>

            <div th:unless="${temasAsignatura.totalElements > 0}" class="w-full flex flex-col items-center justify-center py-16 px-4">
                <p>No se encontraron resultados</p>
            </div>
        </div>

    </main>
</body>
</html>
