<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" th:replace="~{layout/base_layout :: layout(~{::main})}">
<head th:replace="~{fragments/head :: head('Quizly - Estudiar')}"></head>
<body>
    <main th:fragment="main" class="w-full px-6 py-8 max-w-3xl mx-auto">
        <div class="mb-5">
            <h1 class="text-xl font-semibold tracking-tight text-text break-words" th:text="${mazo.titulo}"></h1>
            <p th:if="${estado.total > 0}" class="mt-1 text-xs text-text-muted hidden md:block">
                Atajos: <kbd class="kbd kbd-xs">Espacio</kbd> mostrar respuesta ·
                <kbd class="kbd kbd-xs">1</kbd>–<kbd class="kbd kbd-xs">4</kbd> calificar
            </p>
        </div>

        <!-- Este bloque se sustituye completo por htmx tras cada calificación -->
        <div id="tarjeta-contenido" th:fragment="tarjeta_fragment" tabindex="-1" aria-live="polite" class="outline-none">

            <!-- Hay una tarjeta pendiente: dos caras en el mismo hueco; al mostrar la respuesta la tarjeta gira -->
            <section th:if="${estado.tarjeta != null}" class="perspective-[1400px]">
                <div id="tarjeta-flip" data-volteada="false"
                    class="grid transform-3d transition-transform duration-1000 ease-out motion-reduce:transition-none data-[volteada=true]:rotate-y-180">

                    <!-- Cara delantera: anverso -->
                    <div id="tarjeta-anverso" class="card col-start-1 row-start-1 backface-hidden">
                        <div class="card-body gap-5">
                            <p class="text-xs text-text-muted" th:text="|Pendientes: ${estado.pendientes} de ${estado.total}|"></p>
                            <div>
                                <p class="text-xs uppercase tracking-wide text-text-muted mb-1">Anverso</p>
                                <p class="text-lg text-text break-words whitespace-pre-line" th:text="${estado.tarjeta.anverso}"></p>
                            </div>
                            <button type="button" id="btn-mostrar" class="btn btn-primary mt-auto">Mostrar respuesta</button>
                        </div>
                    </div>

                    <!-- Cara trasera: reverso y calificación. Inerte hasta que la tarjeta gira -->
                    <div id="tarjeta-reverso" inert tabindex="-1" role="region" aria-label="Reverso"
                        class="card col-start-1 row-start-1 backface-hidden rotate-y-180 outline-none">
                        <div class="card-body gap-5">
                            <p class="text-xs text-text-muted" th:text="|Pendientes: ${estado.pendientes} de ${estado.total}|"></p>
                            <div>
                                <p class="text-xs uppercase tracking-wide text-text-muted mb-1" aria-hidden="true">Reverso</p>
                                <p class="text-lg text-text break-words whitespace-pre-line" th:text="${estado.tarjeta.reverso}"></p>
                            </div>

                            <div id="tarjeta-calificar" class="mt-auto grid grid-cols-2 md:grid-cols-4 gap-2"
                                th:with="url=@{/mazos/{m}/tarjetas/{t}/calificar(m=${mazo.id}, t=${estado.tarjeta.id})}">
                                <button type="button" data-key="1" class="btn btn-error btn-outline"
                                    th:attr="hx-post=${url}" hx-vals='{"calificacion":"OTRA_VEZ"}'
                                    hx-target="#tarjeta-contenido" hx-swap="outerHTML">Otra vez</button>
                                <button type="button" data-key="2" class="btn btn-warning btn-outline"
                                    th:attr="hx-post=${url}" hx-vals='{"calificacion":"DIFICIL"}'
                                    hx-target="#tarjeta-contenido" hx-swap="outerHTML">Difícil</button>
                                <button type="button" data-key="3" class="btn btn-success btn-outline"
                                    th:attr="hx-post=${url}" hx-vals='{"calificacion":"BIEN"}'
                                    hx-target="#tarjeta-contenido" hx-swap="outerHTML">Bien</button>
                                <button type="button" data-key="4" class="btn btn-info btn-outline"
                                    th:attr="hx-post=${url}" hx-vals='{"calificacion":"FACIL"}'
                                    hx-target="#tarjeta-contenido" hx-swap="outerHTML">Fácil</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Nada pendiente, pero una tarjeta vuelve enseguida -->
            <section th:if="${estado.tarjeta == null && estado.minutosEspera != null}"
                class="flex flex-col items-center text-center py-12">
                <i class="fa-regular fa-clock text-3xl text-text-muted mb-3"></i>
                <h2 class="font-semibold text-text" th:text="|Una tarjeta vuelve en ${estado.minutosEspera} min|"></h2>
                <p class="text-sm text-text-muted mt-1">Puedes esperar o terminar la sesión.</p>
                <div class="flex gap-2 mt-4">
                    <button type="button" class="btn btn-primary"
                        th:attr="hx-get=@{/mazos/{m}/siguiente(m=${mazo.id})}"
                        hx-target="#tarjeta-contenido" hx-swap="outerHTML">Comprobar de nuevo</button>
                    <a th:href="@{/mazos}" class="btn btn-outline">Volver a mis mazos</a>
                </div>
            </section>

            <!-- Mazo terminado por hoy, o vacío -->
            <section th:if="${estado.tarjeta == null && estado.minutosEspera == null}"
                class="flex flex-col items-center text-center py-12">
                <i th:if="${estado.total == 0}" class="fa-regular fa-clone text-3xl text-text-muted mb-3"></i>
                <i th:if="${estado.total > 0}" class="fa-regular fa-circle-check text-3xl text-success mb-3"></i>
                <h2 class="font-semibold text-text"
                    th:text="${estado.total == 0 ? 'Este mazo todavía no tiene tarjetas' : 'Has terminado por hoy'}"></h2>
                <p th:if="${estado.total > 0}" class="text-sm text-text-muted mt-1">Vuelve más tarde: las tarjetas reaparecen cuando toca repasarlas.</p>
                <div class="flex gap-2 mt-4">
                    <a th:href="@{/mazos/{m}/editar(m=${mazo.id})}" class="btn btn-outline">Editar mazo</a>
                    <a th:href="@{/mazos}" class="btn btn-primary">Volver a mis mazos</a>
                </div>
            </section>
        </div>

        <script src="/js/tarjetas.js"></script>
    </main>
</body>
</html>
