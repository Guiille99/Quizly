<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!--
        Fragmento reutilizable para la tarjeta de cuestionario.
        - cuestionario: Entidad Cuestionario a representar
        - showActions: booleano (opcional, false por defecto). Si es true, muestra los botones de editar y eliminar
        - filterFormId: ID del formulario de filtro a incluir en peticiones HTMX (por defecto 'quiz-filter-form')
    -->
    <div th:fragment="card(cuestionario, showActions, filterFormId)" class="card selectable-card quiz-card">
        <div class="flex flex-col gap-1 flex-1 min-w-0">
            <span class="quiz-title truncate" th:text="${cuestionario.titulo}"></span>
            <span class="quiz-meta"
                th:text="|${cuestionario.tema != null ? (cuestionario.tema.asignatura != null ? cuestionario.tema.asignatura.nombre + ' · ' : '') + cuestionario.tema.nombre : 'Personal'} · ${cuestionario.preguntas != null ? cuestionario.preguntas.size() : 0} preguntas|">
            </span>
        </div>

        <div class="flex items-center gap-2 shrink-0">
            <div class="badge-difficulty"
                th:classappend="${cuestionario.dificultad != null ? (cuestionario.dificultad.codigo == 'EASY' ? 'badge-difficulty-easy' :
                                 cuestionario.dificultad.codigo == 'MEDIUM' ? 'badge-difficulty-medium' :
                                 cuestionario.dificultad.codigo == 'HARD' ? 'badge-difficulty-hard' : '') : ''}">
                <span th:text="${cuestionario.dificultad != null ? cuestionario.dificultad.nombre : '-'}"></span>
            </div>

            <a class="btn btn-primary btn-sm"
                th:href="@{/cuestionarios/{slug}(slug=${cuestionario.slug})}"
                role="button">Empezar</a>

            <th:block th:if="${showActions}">
                <a class="btn btn-outline btn-sm"
                    th:href="@{/mis-cuestionarios/{id}/editar(id=${cuestionario.id})}"
                    role="button"
                    title="Editar cuestionario">
                    <i class="fa-solid fa-pen"></i>
                </a>

                <form th:action="@{/mis-cuestionarios/{id}/eliminar(id=${cuestionario.id})}" method="post"
                    hx-post="#"
                    hx-target="#lista-cuestionarios"
                    th:hx-include="'#' + ${filterFormId ?: 'quiz-filter-form'}"
                    hx-swap="outerHTML"
                    hx-confirm="¿Seguro que quieres eliminar este cuestionario?">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-outline btn-sm text-error" title="Eliminar cuestionario">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </form>
            </th:block>
        </div>
    </div>
</body>
</html>
