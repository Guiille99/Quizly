<nav th:fragment="breadcrumb" th:if="${not #lists.isEmpty(breadcrumbs)}" class="breadcrumbs text-sm px-6 pt-4 pb-0" aria-label="Breadcrumb">
   <ul>
    <li th:each="item, stat : ${breadcrumbs}">
        <a th:if="${!stat.last and item.url != null}" th:href="${item.url}" class="hover:text-primary transition" th:text="${item.label}"></a>
        <span th:if="${!stat.last and item.url == null}" class="opacity-70" th:text="${item.label}"></span>
        <span th:if="${stat.last}" class="font-bold truncate max-w-xs md:max-w-md inline-block align-bottom" aria-current="page" th:title="${item.label}" th:text="${item.label}"></span>
    </li>
   </ul> 
</nav>
