<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      th:fragment="layout (title, containerVariant, heading, subtitle, content, footer)">
<head th:replace="~{fragments/head :: head(${title})}"></head>
<body class="flex min-h-screen items-center justify-center px-5 py-7">
  <div class="surface-card flex flex-col gap-2 w-full p-4" 
    th:classappend="${containerVariant == 'wide'} ? 'max-w-2xl' : 'max-w-md'">
    <header>
      <a th:href="@{/}" class="mb-5 inline-block no-underline">
        <span class="flex size-8 items-center justify-center rounded-lg bg-accent text-sm font-semibold text-text-inverse">Q</span>
        <span class="text-sm font-semibold tracking-tight text-text"></span>
      </a>
      <h1 class="text-lg font-semibold tracking-tight text-text" th:text="${heading}"></h1>
      <p class="mt-1 text-sm text-text-muted" th:text="${subtitle}"></p>
    </header>
    <div th:replace="${content}"></div>
    <div th:replace="${footer}" class="text-xs"></div>
  </div>
</body>
</html>
