<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" th:fragment="layout(main)">
<head th:replace="~{fragments/head :: head('Quizly')}"></head>
<body>
    <header class="navbar bg-base-100 border-b border-base-300/60 px-4 justify-between sticky top-0 z-30 shadow-xs">
        <!-- LOGO -->
        <div class="flex items-center gap-3">
            <img th:src="@{/img/Logo.svg}" alt="Logo" class="size-8">
            <span class="text-lg font-bold tracking-tight text-base-content">Quizly</span>
        </div>

        <div class="flex items-center gap-5">
            <!-- MODO CLARO/OSCURO -->
            <label class="toggle text-base-content">
                <input id="theme-toggle" type="checkbox" value="dark" class="theme-controller" onchange="toggleTheme()" />
                <svg aria-label="sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></g></svg>
                <svg aria-label="moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></g></svg>  
            </label>
    
            <div class="flex">
                <!-- CONTADOR -->
                <div th:if="${quizSession != null and quizSession.hasTiempoLimite()}" id="quiz-timer" class="md:flex items-center gap-2 px-4 py-2 rounded-xl"
                    th:attr="data-seconds=${quizSession.segundosRestantes}, 
                    data-timeout-url=@{/cuestionarios/{slug}/timeout(slug=${quizSession.slug})}">
        
                    <i class="fa-regular fa-clock"></i>
        
                    <span id="quiz-timer-text" class="font-mono font-semibold"></span>
        
                </div>
        
                <!-- AVATAR -->
                <div class="flex-none gap-3">
                    <div class="avatar size-9 min-h-0">
                        <div class="badge-default">
                            <span th:text="${currentUser.iniciales}"></span>
                        </div>
                    </div>
    
            </div>
            </div>       
        </div>
    </header>

    <!-- MAIN -->
    <main th:replace="${main}"></main>

    <div th:replace="~{fragments/toast :: toast}"></div>
</body>
<script src="/js/quiz-timer.js"></script>
</html>
