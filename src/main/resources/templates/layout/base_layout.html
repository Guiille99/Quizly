<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" th:fragment="layout(main)">
<head th:replace="~{fragments/head :: head('Quizly')}"></head>
<body>   
    <div class="drawer md:drawer-open min-h-screen">
        <input id="sidebar-drawer" class="drawer-toggle" type="checkbox">
    
        <div class="drawer-content flex flex-col min-h-screen bg-base-200">
            <!-- HEADER + SIDEBAR -->
            <header class="navbar bg-base-100 border-b border-base-300/60 px-4 justify-between sticky top-0 z-30 shadow-xs">
                <div class="flex-one">
                    <label for="sidebar-drawer" class="btn btn-square btn-ghost md:hidden animate-none"
                        aria-label="Abrir menú">
                        <i class="bi bi-list text-3xl"></i>
                    </label>
                </div>
    
                <!-- <div class="flex-1 px-2">
                    <h2 class="text-md font-semibold tracking-tight md:text-lg text-base-content">Panel principal</h2>
                </div> -->
                <div class="flex-none gap-3">
                    <div class="dropdown dropdown-end">
                        <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar size-9 min-h-0">
                            <div class="badge-default">
                                <span th:text="${currentUser.iniciales}"></span>
                            </div>
                        </div>
                        <ul tabindex="0"
                            class="menu menu-sm dropdown-content">
                            <li><a class="py-2">Mi perfil</a></li>
                            <li><a class="py-2">Ajustes</a></li>
                            <hr class="border-base-300/60 my-1" />
                            <li>                                
                                <form th:action="@{/logout}" method="post" class="w-full">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button type="submit" class="w-full text-left text-error py-2 cursor-pointer">Cerrar sesión</button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </header>
    

            <!-- MAIN -->
            <main th:replace="${main}"></main>
        </div>
    
        <!-- SIDEBAR -->
        <div class="drawer-side z-40">
            <label for="sidebar-drawer" aria-label="Cerrar menú" class="drawer-overlay"></label>
    
            <aside id="sidebar">
    
                <div class="flex flex-col gap-6">
    
                    <div class="flex items-center gap-3 px-2 py-1.5">
                        <span
                            class="flex size-9 items-center justify-center rounded-xl bg-primary text-base font-bold text-primary-content">Q</span>
                        <span class="text-lg font-bold tracking-tight text-base-content">Quizly</span>
                    </div>
    
                    <nav>
                        <ul class="menu w-full p-0 gap-1 text-base-content/75 font-medium text-[14px]">
                            <li>
                                <a th:href="@{/}" class="btn-link" th:classappend="${currentUri == '/'} ? 'active'">
                                    <i class="bi bi-house-door"></i>
                                    Inicio
                                </a>
                            </li>
                            <li>
                                <a th:href="@{/asignaturas}" class="btn-link" th:classappend="${currentUri == '/asignaturas'} ? 'active'">
                                    <i class="bi bi-journal-bookmark-fill"></i>
                                    Asignaturas
                                </a>
                            </li>
                            <li>
                                <details open>
                                    <summary class="bi bi-card-checklist btn-link">Cuestionarios</summary>
                                    <ul>
                                        <li><a href="" class="btn-link">Todos</a></li>
                                        <li><a href="" class="btn-link">Favoritos</a></li>
                                        <li><a href="" class="btn-link">Recientes</a></li>
                                    </ul>
                                </details>
                            </li>
                            <li>
                                <a class="btn-link">
                                    <i class="bi bi-graph-up-arrow"></i>
                                    Mi progreso
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
    
                <!-- SIDEBAR FOOTER -->
                <div class="p-2.5 rounded-xl bg-base-200/70 border border-base-300/40">
                    <div class="flex flex-col gap-2 min-w-0">
                        <div class="flex gap-2 items-center">
                            <div class="size-2 rounded-full bg-success shrink-0"></div>
                            <span class="text-xs font-semibold text-base-content/90 truncate" 
                                th:text="| ${currentUser.nombre}  ${currentUser.apellidos}|"></span>
                        </div>
                        <span class="badge badge-sm font-bold" 
                            th:classappend="${currentUser.rol.name() == 'ADMIN' ? 'badge-admin' : 'badge-user'}"
                            th:text="${currentUser.rol.name() == 'ADMIN' ? 'Administrador' : 'Estudiante'}"
                        ></span>
                    </div>
                </div>
            </aside>
            </header>
        </div>
    </div>


    <div th:replace="~{fragments/toast :: toast}"></div>



</body>
</html>
