<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" th:fragment="layout(main)">
<head th:replace="~{fragments/head :: head('Quizly')}"></head>
<body>   
    <div class="drawer md:drawer-open min-h-screen">
        <input id="sidebar-drawer" class="drawer-toggle" type="checkbox">
    
        <div class="drawer-content flex flex-col min-h-screen bg-base-200">
            <!-- HEADER + SIDEBAR -->
            <header class="navbar bg-base-100 border-b border-base-300/60 px-4 justify-between sticky top-0 z-30 shadow-xs">
                <div class="flex-one">
                    <label for="sidebar-drawer" class="btn btn-square btn-ghost md:hidden animate-none"
                        aria-label="Abrir menú">
                        <i class="fa-solid fa-bars text-3xl"></i>
                    </label>
                </div>
    
                <div class="flex items-center gap-5">
                    <!-- SWICTH THEME MODE -->
                    <label th:replace="~{fragments/theme-toggle :: toggle}"></label>
    
                    
                    <!-- NOTIFICACIONES DROPDOWN -->
                    <div class="dropdown dropdown-end">
                        <button type="button" tabindex="0" class="btn btn-ghost btn-circle size-9 min-h-0 relative" hx-get="/notificaciones/dropdown"
                            hx-target="#notificaciones-dropdown-container" hx-trigger="mouseenter once, touchstart once" aria-label="Notificaciones">

                            <i class="fa-regular fa-bell text-lg"></i>

                            <span id="notificaciones-badge-container">
                                <span th:if="${numNotificacionesPendientes != null and numNotificacionesPendientes > 0}"
                                    class="badge badge-primary badge-xs absolute -top-0.5 -right-0.5 font-bold px-1 min-w-4 h-4 text-[10px]"
                                    th:text="${numNotificacionesPendientes}">
                                </span>
                            </span>
                        </button>

                        <div tabindex="0" class="dropdown-content z-50 p-0 shadow-lg bg-base-100 rounded-box border border-base-300 mt-2 w-[calc(100vw-6rem)]! max-w-96 sm:w-96! right-0 left-auto">
                            <div id="notificaciones-dropdown-container">
                                <div class="p-4 text-center text-xs text-base-content/60">
                                    <span class="loading loading-spinner loading-xs mr-2"></span>
                                    Cargando...
                                </div>
                            </div>
                        </div>
                    </div>


                    <!-- AVATAR USUARIO -->
                    <div class="flex-none gap-3">
                        <div class="dropdown dropdown-end">
                            <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar size-9 min-h-0">
                                <div class="badge-default">
                                    <span th:text="${currentUser.iniciales}"></span>
                                </div>
                            </div>
                            <ul tabindex="0"
                                class="menu menu-sm dropdown-content">
                                <li><a th:href="@{/mi-perfil}" class="py-2">Mi perfil</a></li>
                                <!-- <li><a class="py-2">Ajustes</a></li> -->
                                <hr class="border-base-300/60 my-1" />
                                <li>                                
                                    <form th:action="@{/logout}" method="post" class="w-full p-0 block">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <button type="submit" class="w-full text-left text-error py-2 px-3 cursor-pointer">Cerrar sesión</button>
                                    </form>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </header>
    

            <div th:replace="~{components/commons/breadcrumb :: breadcrumb}"></div>
            <!-- MAIN -->
            <main th:replace="${main}"></main>
        </div>
    
        <!-- SIDEBAR -->
        <div class="drawer-side z-40">
            <label for="sidebar-drawer" aria-label="Cerrar menú" class="drawer-overlay"></label>
    
            <aside id="sidebar" class="flex flex-col h-full max-h-screen">
                <div class="flex items-center gap-3 px-2 py-1.5 shrink-0 mb-6">
                    <img th:src="@{/img/Logo.svg}" alt="Logo" class="size-8">
                    <span class="text-lg font-bold tracking-tight text-base-content">Quizly</span>
                </div>    

                <nav class="flex-1 overflow-y-auto pr-2 pb-4">
                    <ul class="menu w-full p-0 gap-1 text-base-content/75 font-medium text-[14px]">
                        <li>
                            <a th:href="@{/}" class="btn-link" th:classappend="${currentUri == '/'} ? 'active'">
                                <i class="fa-solid fa-house"></i>
                                Inicio
                            </a>
                        </li>
                        <li>
                            <a th:href="@{/asignaturas}" class="btn-link" th:classappend="${currentUri.startsWith('/asignaturas')} ? 'active'">
                                <i class="fa-solid fa-book-bookmark"></i>
                                Asignaturas
                            </a>
                        </li>
                        <li>
                            <details open>
                                <summary class="btn-link">
                                    <i class="fa-solid fa-list-check"></i>
                                    Cuestionarios
                                </summary>
                                <ul>
                                    <li>
                                        <a th:href="@{/cuestionarios}" class="btn-link" 
                                            th:classappend="${currentUri == '/cuestionarios'} ? 'active'">Todos</a>
                                    </li>
                                    <li>
                                        <a th:href="@{/mis-cuestionarios}" class="btn-link" 
                                            th:classappend="${currentUri.startsWith('/mis-cuestionarios')} ? 'active'">Mis cuestionarios</a>
                                    </li>
                                    <li>
                                        <a th:href="@{/favoritos}" class="btn-link"
                                            th:classappend="${currentUri.startsWith('/favoritos')} ? 'active'">Favoritos</a>
                                    </li>
                                    <li>
                                        <a th:href="@{/cuestionarios/recientes}" class="btn-link"
                                            th:classappend="${currentUri == '/cuestionarios/recientes'} ? 'active'">Recientes</a>
                                    </li>
                                </ul>
                            </details>
                        </li>
                        <li>
                            <a th:href="@{/miProgreso}" class="btn-link"
                                th:classappend="${currentUri == '/miProgreso'} ? 'active'">
                                <i class="fa-solid fa-arrow-trend-up"></i>
                                Mi progreso
                            </a>
                        </li>
                        
                        <!-- Apartado ADMIN -->
                        <th:block sec:authorize="hasRole('ADMIN')">
                            <div class="divider"></div>

                            <li>
                                <details open>
                                    <summary class="btn-link">
                                        <i class="fa-solid fa-screwdriver-wrench"></i>
                                        Administración
                                    </summary>
                                    <ul>
                                        <li>
                                            <a th:href="@{/admin}" class="btn-link" 
                                                th:classappend="${currentUri == '/admin'} ? 'active'">
                                                Dashboard
                                            </a>
                                        </li>

                                        <li>
                                            <a th:href="@{/admin/cuestionarios}" class="btn-link"
                                                th:classappend="${currentUri.startsWith('/admin/cuestionarios')} ? 'active'">
                                                Cuestionarios
                                            </a>
                                        </li>

                                        <li>
                                            <a th:href="@{/admin/temas}" class="btn-link"
                                                th:classappend="${currentUri.startsWith('/admin/temas')} ? 'active'">
                                                Temas
                                            </a>
                                        </li>

                                        <li>
                                            <a th:href="@{/admin/asignaturas}" class="btn-link"
                                                th:classappend="${currentUri.startsWith('/admin/asignaturas')} ? 'active'">
                                                Asignaturas
                                            </a>
                                        </li>

                                        <li>
                                            <a th:href="@{/admin/usuarios}" class="btn-link"
                                                th:classappend="${currentUri.startsWith('/admin/usuarios')} ? 'active'">
                                                Usuarios
                                            </a>
                                        </li>
                                    </ul>
                                </details>
                            </li>
                        </th:block>
                    </ul>
                </nav>
    
                <!-- SIDEBAR FOOTER -->
                <div class="p-2.5 rounded-xl bg-base-200/70 border border-base-300/40 mt-auto shrink-0">
                    <div class="flex flex-col gap-2 min-w-0">
                        <div class="flex gap-2 items-center">
                            <div class="size-2 rounded-full bg-success shrink-0"></div>
                            <span class="text-xs font-semibold text-base-content/90 truncate" 
                                th:text="| ${currentUser.nombre}  ${currentUser.apellidos}|"></span>
                        </div>
                        <span class="badge badge-sm font-bold" 
                            th:classappend="${currentUser.rol.name() == 'ADMIN' ? 'badge-admin' : 'badge-user'}"
                            th:text="${currentUser.rol.name() == 'ADMIN' ? 'Administrador' : 'Estudiante'}"
                        ></span>
                        <span th:if="${appVersion}" class="font-mono text-[11px] text-base-content/40 pt-2 border-t border-base-300/40"
                            th:text="|Quizly v${appVersion}|"></span>
                    </div>
                </div>
            </aside>
        </div>
    </div>


    <div th:replace="~{fragments/toast :: toast}"></div>
    <div th:replace="~{components/commons/confirm-dialog :: confirmDialog}"></div>
</body>
</html>
