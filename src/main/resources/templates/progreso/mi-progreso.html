<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" th:replace="~{layout/base_layout :: layout(~{::main})}">
<head th:replace="~{fragments/head :: head('Quizly - Mi progreso')}"></head>
<body>
    <main th:fragment="main" class="w-full px-6 py-8">
        <div class="mb-5">
            <h1 class="text-xl font-semibold tracking-tight text-text">Mi progreso</h1>
            <p class="mt-1 text-sm text-text-muted">Seguimiento detallado de tu rendimiento</p>
        </div>

        <!-- Estadísticas principales -->
        <div class="stats__container w-full mb-5">
            <div class="card stat-card flex-1">
                <span class="stat-number blue" th:text="${nCuestionariosCompletados}"></span>
                <p class="stat-text">Cuestionarios completados</p>
            </div>
            <div class="card stat-card flex-1">
                <span class="stat-number green" th:text="${puntuacionMedia} + '%'"></span>
                <p class="stat-text">Puntuación media</p>
            </div>
            <div class="card stat-card flex-1">
                <span class="stat-number orange" th:text="${nAsignaturasActivas}">0</span>
                <p class="stat-text">Asignaturas activas</p>
            </div>
            <div class="card stat-card flex-1">
                <span class="stat-number purple" th:text="${tiempoEstudio}">10</span>
                <p class="stat-text">Tiempo de estudio</p>
            </div>
        </div>

        <!-- Historial de intentos de cuestionarios -->
        <div>
            <p class="section-title">HISTORIAL DE CUESTIONARIOS</p>
            <div th:replace="~{components/table/skeleton :: base(
                tableId='historial-cuestionarios-table', 
                page=${historialCuestionariosPage}, 
                thead=~{::thead}, 
                tbody=~{::tbody}, 
                filterFormId=null, 
                targetUrl='/miProgreso/historial-cuestionario/tableData',
                pageParamName='page',
                sizeOptions=${ {5, 10, 20, 50} } )}" 
                th:fragment="historial-cuestionarios-table_fragment">
    
                <thead>
                    <tr>
                        <th>Cuestionario</th>
                        <th>Asignatura</th>
                        <th>Dificultad</th>
                        <th>Puntuación</th>
                        <th>Fecha</th>
                    </tr>
                </thead>
                
                <tbody>
                    <tr th:each="intentoCuestionario : ${historialCuestionariosPage.content}">
                        <td th:text="${intentoCuestionario.cuestionario.titulo}"></td>
    
                        <td th:text="${intentoCuestionario.cuestionario.tema.asignatura.nombre}"></td>
                        <td>
                            <div class="badge-difficulty" th:classappend="${intentoCuestionario.cuestionario.dificultad.codigo == 'EASY' ? 'badge-difficulty-easy' 
                                : intentoCuestionario.cuestionario.dificultad.codigo == 'MEDIUM' ? 'badge-difficulty-medium' 
                                : intentoCuestionario.cuestionario.dificultad.codigo == 'HARD' ? 'badge-difficulty-hard' : ''}">
                                <span th:text="${intentoCuestionario.cuestionario.dificultad.nombre}"></span>
                            </div>
                        </td>
    
                        <td>
                            <span class="auto-range font-bold" 
                                th:text="|${intentoCuestionario.porcentajeAciertosRedondeado}%|"
                                th:style="|--value:${intentoCuestionario.porcentajeAciertosRedondeado}|" />
                        </td>
    
                        <td th:text="${intentoCuestionario.fechaFinFormateadaDDMMYYY}"></td>
                    </tr>
                </tbody>
            </div>
        </div>
    </main>
</body>
</html>
