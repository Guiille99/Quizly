<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Fragmento del contenido del dropdown de notificaciones -->
    <div th:fragment="dropdown-content" id="notificaciones-dropdown-content" class="p-3 text-base-content">
        <!-- OOB update for navbar notification bell badge -->
        <span id="notificaciones-badge-container" hx-swap-oob="true">
            <span th:if="${numNotificacionesPendientes != null and numNotificacionesPendientes > 0}"
                  class="badge badge-primary badge-xs absolute -top-0.5 -right-0.5 font-bold px-1 min-w-4 h-4 text-[10px]"
                  th:text="${numNotificacionesPendientes}"></span>
        </span>

        <div class="flex items-center justify-between pb-2 mb-2 border-b border-base-300">
            <span class="font-bold text-sm">Notificaciones</span>
            <span th:if="${numNotificacionesPendientes != null and numNotificacionesPendientes > 0}" 
                  class="badge badge-primary badge-sm font-semibold" 
                  th:text="|${numNotificacionesPendientes} pendientes|"></span>
        </div>

        <!-- Estado vacío -->
        <div th:if="${compartidosPendientes == null or #lists.isEmpty(compartidosPendientes)}" class="py-8 text-center">
            <div class="w-12 h-12 rounded-full bg-base-200 flex items-center justify-center mx-auto mb-2 text-base-content/40">
                <i class="fa-regular fa-bell-slash text-xl"></i>
            </div>
            <p class="text-sm font-medium text-base-content/70">No tienes notificaciones pendientes</p>
            <p class="text-xs text-base-content/50 mt-1">Aquí verás los cuestionarios que otros usuarios compartan contigo.</p>
        </div>

        <!-- Lista de cuestionarios compartidos pendientes -->
        <div th:if="${compartidosPendientes != null and !#lists.isEmpty(compartidosPendientes)}" class="flex flex-col gap-2.5 max-h-96 overflow-y-auto pr-1">
            <div th:each="comp : ${compartidosPendientes}" class="p-3 rounded-lg bg-base-200/60 border border-base-300 flex flex-col gap-2">
                <div class="flex items-start justify-between gap-2">
                    <div class="flex flex-col min-w-0">
                        <span class="text-xs font-semibold text-primary truncate" th:text="|@${comp.emisor.username}|">@usuario</span>
                        <span class="text-sm font-bold truncate text-base-content" th:text="${comp.cuestionarioOrigen.titulo}">Título del cuestionario</span>
                        <span class="text-[11px] text-base-content/60" 
                              th:text="|${comp.cuestionarioOrigen.preguntas != null ? comp.cuestionarioOrigen.preguntas.size() : 0} preguntas · ${comp.cuestionarioOrigen.dificultad != null ? comp.cuestionarioOrigen.dificultad.nombre : '-'}|">
                        </span>
                    </div>
                </div>

                <div class="flex items-center justify-end gap-2 pt-1 border-t border-base-300/50">
                    <!-- Rechazar -->
                    <button type="button" 
                            class="btn btn-ghost btn-xs text-error hover:bg-error/10"
                            th:attr="hx-post=@{/notificaciones/compartidos/{id}/rechazar(id=${comp.id})}"
                            hx-target="#notificaciones-dropdown-content"
                            hx-swap="outerHTML">
                        <i class="fa-solid fa-xmark mr-1"></i> Rechazar
                    </button>

                    <!-- Aceptar -->
                    <button type="button" 
                            class="btn btn-primary btn-xs"
                            th:attr="hx-post=@{/notificaciones/compartidos/{id}/aceptar(id=${comp.id})}"
                            hx-target="#notificaciones-dropdown-content"
                            hx-swap="outerHTML">
                        <i class="fa-solid fa-check mr-1"></i> Aceptar
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
