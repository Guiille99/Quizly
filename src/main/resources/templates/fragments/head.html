<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <meta th:if="${noindex}" name="robots" content="noindex">
    <title th:text="${title}">Quizly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="/img/favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.2"></script>
    <script>
        document.addEventListener('htmx:configRequest', (evt) => {
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
            const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;

            if (csrfHeader && csrfToken) {
                evt.detail.headers[csrfHeader] = csrfToken;
            }
        });
    </script>
    <link rel="stylesheet" th:href="@{/css/tailwind.css}">
    <script src="/js/toast.js"></script>
    <script src="/js/progress-helper.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/page-animations.js"></script>
    <script src="/js/admin/dashboard.js"></script>
    <script src="/js/toggle-disabled-fields.js"></script>
    <script src="/js/confirm-dialog.js"></script>
    <script src="/js/loading-state.js"></script>
</head>
