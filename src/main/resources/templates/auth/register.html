<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      th:replace="~{layout/auth_layout :: layout('Crear cuenta · Quizly', 'wide', 'Crea tu cuenta', 'Empieza a aprender en segundos', ~{::content}, ~{::footer})}">
<!-- <head>
  <title th:fragment="title">Crear cuenta · Quizly</title>
</head> -->
<body>

<div th:fragment="content" class="mt-6 flex flex-col gap-4">
  <form th:action="@{/register}" th:object="${registerForm}" method="post" class="form-stack">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <fieldset class="fieldset p-0">
        <label class="label" for="nombre">Nombre</label>
        <input class="input w-full" type="text" id="nombre" th:field="*{nombre}"
               autocomplete="nombre" placeholder="Nombre"
               th:classappend="${#fields.hasErrors('nombre')} ? 'input-error'">
        <p th:if="${#fields.hasErrors('nombre')}" class="text-error" th:errors="*{nombre}"></p>
      </fieldset>
  
      <fieldset class="fieldset p-0">
        <label class="label" for="apellidos">Apellidos</label>
        <input class="input w-full" type="text" id="apellidos" th:field="*{apellidos}"
               autocomplete="apellidos" placeholder="Apellidos"
               th:classappend="${#fields.hasErrors('apellidos')} ? 'input-error'">
        <p th:if="${#fields.hasErrors('apellidos')}" class="text-error" th:errors="*{apellidos}"></p>
      </fieldset>
    </div>

    <fieldset class="fieldset p-0">
      <label class="label" for="username">Nombre de usuario</label>
      <input class="input w-full" type="text" id="username" th:field="*{username}"
             autocomplete="username" placeholder="Nombre de usuario"
             th:classappend="${#fields.hasErrors('username')} ? 'input-error'">
      <p th:if="${#fields.hasErrors('username')}" class="text-error" th:errors="*{username}"></p>
    </fieldset>

    <fieldset class="fieldset p-0">
      <label class="label" for="email">Correo electrónico</label>
      <input class="input w-full" type="email" id="email" th:field="*{email}"
             autocomplete="email" placeholder="nombre@ejemplo.com"
             th:classappend="${#fields.hasErrors('email')} ? 'input-error'">
      <p th:if="${#fields.hasErrors('email')}" class="text-error" th:errors="*{email}"></p>
    </fieldset>

    <fieldset class="fieldset p-0">
      <label class="label" for="password">Contraseña</label>
      <input class="input w-full" type="password" id="password" th:field="*{password}"
             autocomplete="new-password" placeholder="Mínimo 8 caracteres"
             th:classappend="${#fields.hasErrors('password')} ? 'input-error'">
      <p th:if="${#fields.hasErrors('password')}" class="text-error" th:errors="*{password}"></p>
    </fieldset>

    <fieldset class="fieldset p-0">
      <label class="label" for="passwordConfirm">Confirmar contraseña</label>
      <input class="input w-full" type="password" id="passwordConfirm" th:field="*{passwordConfirm}"
             autocomplete="new-password" placeholder="Repite tu contraseña"
             th:classappend="${#fields.hasErrors('passwordConfirm') or #fields.hasErrors('passwordConfirmValid')} ? 'input-error'">
      <p th:if="${#fields.hasErrors('passwordConfirm')}" class="text-error" th:errors="*{passwordConfirm}"></p>
      <p th:if="${#fields.hasErrors('passwordConfirmValid')}" class="text-error" th:errors="*{passwordConfirmValid}"></p>
    </fieldset>

    <button type="submit" class="btn btn-primary">Crear cuenta</button>
  </form>
</div>

<div th:fragment="footer" class="text-xs">
  <span>¿Ya tienes cuenta?</span>
  <a th:href="@{/login}" class="link-accent">Inicia sesión</a>
</div>

</body>
</html>
