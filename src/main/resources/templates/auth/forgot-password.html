<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      th:replace="~{layout/auth_layout :: layout('He olvidado la contraseña · Quizly', 'wide', 'Recuperar cuenta', 
        'Introduce tu correo electrónico asociado y te enviaremos un enlace seguro para restablecer tu contraseña', 
        ~{::content}, ~{::footer})}">
<body>
    <div th:fragment="content" class="mt-6 flex flex-col gap-4">
        <form th:action="@{/forgot-password}" th:object="${forgotPasswordForm}" method="post" class="form-stack">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <fieldset class="fieldset p-0">
                <label class="label" for="email">Correo electrónico</label>
                <input class="input w-full" type="email" name="email" id="email" th:field="*{email}"
                    autocomplete="email" placeholder="nombre@ejemplo.com"
                    th:classappend="${#fields.hasErrors('email')} ? 'input-error'">
                    
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-error"></p>
            </fieldset>

            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
    </div>

    <div th:fragment="footer" class="text-xs">
        <a th:href="@{/login}" class="link-accent">Volver a inicio de sesión</a>
    </div>
</body>
</html>
