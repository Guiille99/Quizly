<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      th:replace="~{layout/auth_layout :: layout('Iniciar sesión · Quizly', 'compact', 'Bienvenido de nuevo', 'Accede a tu cuenta para continuar', ~{::content}, ~{::footer})}">
<!-- <head>
  <title th:fragment="title">Iniciar sesión · Quizly</title>
</head> -->
<body>

<div th:fragment="content" class="mt-6 flex flex-col gap-4">
  <div th:if="${param.error}" class="alert alert-error" role="alert">
    <span>Usuario o contraseña incorrectos. Inténtalo de nuevo.</span>
  </div>
  <div th:if="${param.oauthError}" class="alert alert-error" role="alert">
    <span>No se pudo iniciar sesión con Google. Comprueba que tu correo esté verificado.</span>
  </div>
  <div th:if="${param.logout}" class="alert alert-success" role="status">
    <span>Has cerrado sesión correctamente.</span>
  </div>
 
  <form th:action="@{/login}" method="post" class="form-stack">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <fieldset class="fieldset p-0">
      <label class="label" for="username">Usuario</label>
      <input class="input w-full" type="text" id="username" name="username"
             autocomplete="username" placeholder="Usuario" required autofocus>
    </fieldset>

    <fieldset class="fieldset p-0">
      <div class="flex justify-between">
        <label class="label" for="password">
          Contraseña
        </label>
        <a class="link-accent" th:href="@{/forgot-password}" tabindex="-1" aria-disabled="true">¿Olvidaste tu contraseña?</a>
      </div>
      <input class="input w-full" type="password" id="password" name="password"
             autocomplete="current-password" placeholder="Contraseña" required>
    </fieldset>

    <button type="submit" class="btn btn-primary">Iniciar sesión</button>
  </form>

  <div class="divider text-xs">o</div>
  <a th:href="@{/oauth2/authorization/google}" class="btn btn-outline">
    <svg class="size-5" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 010-9.4l-7.9-6.1a24 24 0 000 21.6l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
    Continuar con Google
  </a>
</div>

<div th:fragment="footer" class="text-xs">
  <span>¿No tienes cuenta?</span>
  <a th:href="@{/register}" class="link-accent">Regístrate gratis</a>
</div>

</body>
</html>
