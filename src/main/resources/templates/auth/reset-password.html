<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      th:replace="~{layout/auth_layout :: layout('Reinicio de contraseña · Quizly', 'wide', 'Crear nueva contraseña', 
        'Introduzca la nueva contraseña', 
        ~{::content}, ~{::footer})}">

<body>
    <div th:fragment="content" class="mt-6 flex flex-col gap-4">
        <form th:action="@{/reset-password(token=${resetForm.token})}" th:object="${resetForm}" method="post" class="form-stack">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            
            <fieldset class="fieldset p-0">
                <label class="label" for="password">Contraseña</label>
                <input class="input w-full" type="password" id="password" th:field="*{password}" autocomplete="new-password"
                    placeholder="Mínimo 8 caracteres" th:classappend="${#fields.hasErrors('password')} ? 'input-error'">
                <p th:if="${#fields.hasErrors('password')}" class="text-error" th:errors="*{password}"></p>
            </fieldset>

            <fieldset class="fieldset p-0">
                <label class="label" for="passwordConfirm">Confirmar contraseña</label>
                <input class="input w-full" type="password" id="passwordConfirm" th:field="*{passwordConfirm}"
                       autocomplete="new-password" placeholder="Repite tu contraseña"
                       th:classappend="${#fields.hasErrors('passwordConfirm') or #fields.hasErrors('passwordMatch')} ? 'input-error'">
                <p th:if="${#fields.hasErrors('passwordConfirm')}" class="text-error" th:errors="*{passwordConfirm}"></p>
                <p th:if="${#fields.hasErrors('passwordMatch')}" class="text-error" th:errors="*{passwordMatch}"></p>
              </fieldset>

            <button type="submit" class="btn btn-primary">Cambiar contraseña</button>
        </form>
    </div>

    <div th:fragment="footer" class="text-xs"></div>
</body>
</html>
