<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" th:replace="~{layout/quiz_layout :: layout(~{::main})}">
<head th:replace="~{fragments/head :: head('Quizly')}"></head>
<body>
    <main id="quiz-start__container" th:fragment="main" class="w-full px-6 py-8">
        <div id="quiz-start__card" class="card w-10/12 md:w-8/12 lg:w-5/12 mx-auto">
            <div class="card-body">
                <div class="icon-blur-container icon-blur-blue self-center">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>

                <h2 class="text-2xl font-bold text-center" th:text="${quiz.titulo}"></h2>
                <p class="text-sm text-text-muted text-center">
                    <span th:text="${quiz.descripcion}"></span>
                </p>

                <div id="quiz-start__info">
                    <!-- Tema del cuestionario -->
                    <div class="quiz-start__info__item">
                        <div class="quiz-start__info__item__header">
                            <i class="fa-solid fa-book-bookmark text-amber-600"></i>
                            <span>Tema</span>
                        </div>
                        <span class="quiz-start__info__item__text" th:text="${quiz.tema.nombre}"></span>
                    </div>

                    <!-- Dificultad del cuestionario -->
                    <div class="quiz-start__info__item">
                        <div class="quiz-start__info__item__label">
                            <i class="fa-solid fa-fire text-rose-500"></i>
                            <span>Dificultad: </span>
                        </div>
                        <span class="quiz-start__info__item__text" th:text="${quiz.dificultad.nombre}"></span>
                    </div>

                    <!-- Número de preguntas -->
                    <div class="quiz-start__info__item">
                        <div class="quiz-start__info__item__label">
                            <i class="fa-solid fa-list-check text-accent-blue"></i>
                            <span>Preguntas: </span>
                        </div>
                        <span class="quiz-start__info__item__text" th:text="${quiz.preguntas.size()}"></span>
                    </div>

                    <!-- Tiempo límite -->
                    <div class="quiz-start__info__item">
                        <div class="quiz-start__info__item__label">
                            <i class="fa-solid fa-clock text-accent-blue"></i>
                            <span>Tiempo límite: </span>
                        </div>
                        <span th:if="${quiz.tiempoLimite != null}" class="quiz-start__info__item__text" 
                            th:text="${quiz.getTiempoLimiteNatural}"></span>
                        
                        <span th:unless="${quiz.tiempoLimite != null}">No tiene</span>
                    </div>
                </div>

                <form th:action="@{/cuestionarios/{slug}/start(slug=${quiz.slug})}" method="post">

                    <button type="submit" class="btn btn-primary w-full">
                        <i class="fa-solid fa-play"></i>
                        Comenzar
                    </button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
