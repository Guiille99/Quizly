<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" th:replace="~{layout/quiz_layout :: layout(~{::main})}">
<head th:replace="~{fragments/head :: head('Quizly')}"></head>
<body>
    <main th:fragment="main" class="w-full px-6 py-8">
        <div id="quiz-content" class="relative" hx-indicator="#quiz-answer-indicator"
            th:fragment="quiz-content">
            <div th:replace="~{components/commons/loading-overlay :: overlay('quiz-answer-indicator')}"></div>
            <!-- Cabecera -->
            <div class="mb-8">
                <div class="card bg-accent-blue-muted! flex flex-col gap-6 md:flex-row md:items-start md:justify-between">
                    <div>    
                        <div class="mt-4 flex flex-wrap justify-between md:justify-normal md:gap-10">
                            <div th:if="${quizSession.tema != null}">
                                <i class="fa-solid fa-brain text-blue-500"></i>
                                <span class="font-bold">Tema:</span>
                                <span th:text="${quizSession.tema}"></span>
                            </div>
                            <p>
                                <span class="font-bold">Dificultad:</span>
                                <span th:text="${quizSession.dificultad}"></span>
                            </p>
                        </div>
                    </div>
    
                    <div class="text-right">
                        <p class="text-sm opacity-70">Pregunta</p>
                        <p class="text-4xl font-bold">
                            <span th:text="${quizSession.currentQuestionIndex + 1}"></span>
                            <span class="opacity-40">/</span>
                            <span th:text="${quizSession.preguntas.size()}"></span>
                        </p>
                    </div>
                </div>
    
                <progress class="progress progress-primary mt-6 w-full" th:value="${quizSession.progress}" max="100"></progress>

                <!-- Barra de navegación por preguntas (Stepper / Pills) -->
                <div class="mt-4 flex items-center gap-2 overflow-x-auto py-2">
                    <div th:each="preg, iter : ${quizSession.preguntas}">
                        <!-- Pregunta actual activa -->
                        <button type="button"
                            th:if="${iter.index == quizSession.currentQuestionIndex}"
                            class="btn btn-sm btn-primary shadow-sm ring-2 ring-primary ring-offset-2 ring-offset-base-100 font-bold min-w-9 min-h-9 p-0 flex items-center justify-center">
                            <span th:text="${iter.count}">1</span>
                        </button>

                        <!-- Pregunta desbloqueada / accesible -->
                        <button type="button"
                            th:if="${iter.index <= quizSession.maxReachedQuestionIndex and iter.index != quizSession.currentQuestionIndex}"
                            th:hx-post="@{/cuestionarios/{slug}/navigate(slug=${quizSession.slug}, targetIndex=${iter.index})}"
                            hx-target="#quiz-content" hx-swap="outerHTML"
                            th:class="${quizSession.isQuestionAnswered(preg.id()) 
                                ? 'btn btn-sm btn-outline border-primary/50 text-primary hover:btn-primary min-w-9 min-h-9 p-0 flex items-center justify-center gap-0.5' 
                                : 'btn btn-sm btn-outline min-w-9 min-h-9 p-0 flex items-center justify-center'}"
                            th:title="${quizSession.isQuestionAnswered(preg.id()) ? 'Pregunta ' + iter.count + ' (Respondida)' : 'Pregunta ' + iter.count}">
                            <span th:text="${iter.count}">1</span>
                            <i th:if="${quizSession.isQuestionAnswered(preg.id())}" class="fa-solid fa-check text-[9px] opacity-75"></i>
                        </button>

                        <!-- Pregunta bloqueada (futura no alcanzada) -->
                        <button type="button"
                            th:if="${iter.index > quizSession.maxReachedQuestionIndex}"
                            disabled
                            class="btn btn-sm btn-disabled opacity-30 cursor-not-allowed pointer-events-none min-w-9 min-h-9 p-0 flex items-center justify-center gap-0.5"
                            th:title="'Pregunta ' + ${iter.count} + ' (Bloqueada)'">
                            <span th:text="${iter.count}">1</span>
                            <i class="fa-solid fa-lock text-[8px] opacity-60"></i>
                        </button>
                    </div>
                </div>
            </div>
    
            <!-- Tarjeta -->
            <div id="question-card" th:fragment="question-card" class="card bg-base-100 shadow-xl border border-base-300">
            
                <div class="card-body p-6">
                    <h2 class="text-lg font-semibold leading-relaxed" th:text="${question.statement}"></h2>
            
                    <form id="answer-form" th:action="@{/cuestionarios/{slug}/answer(slug=${quizSession.slug})}"
                        th:hx-post="@{/cuestionarios/{slug}/answer(slug=${quizSession.slug})}" hx-trigger="change"
                        hx-target="#quiz-content" hx-swap="outerHTML" class="mt-8 space-y-4">
    
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            
                        <label th:each="option,iter : ${question.options}" class="block cursor-pointer">
                            <input type="radio" name="optionId" th:value="${option.id}"
                                th:checked="${selectedOptionId != null and selectedOptionId == option.id}"
                                class="peer sr-only" required />
            
                            <div class="rounded-xl border border-base-300 bg-base-100 p-5 transition-all duration-200 hover:border-primary
                                hover:bg-primary/5 peer-checked:border-primary peer-checked:bg-primary/10
                                peer-checked:ring-2 peer-checked:ring-primary">
            
                                <div class="flex gap-4">
            
                                    <div class="flex h-10 w-10 items-center justify-center rounded-full bg-base-200 font-bold">
            
                                        <span th:text="${#strings.arraySplit('A,B,C,D,E,F', ',')[iter.index]}"></span>
            
                                    </div>
            
                                    <div class="flex-1">
                                        <p class="leading-relaxed" th:text="${option.text}"></p>
                                    </div>
                                </div>
                            </div>
                        </label>
                    </form>

                    <!-- Pie de navegación entre preguntas -->
                    <div class="mt-8 pt-6 border-t border-base-200 flex flex-col-reverse sm:flex-row items-center justify-between gap-4">
                        <!-- Botón Anterior -->
                        <button type="button" 
                            th:if="${quizSession.currentQuestionIndex > 0}"
                            th:hx-post="@{/cuestionarios/{slug}/navigate(slug=${quizSession.slug}, targetIndex=${quizSession.currentQuestionIndex - 1})}"
                            hx-target="#quiz-content" hx-swap="outerHTML"
                            class="btn btn-outline gap-2 w-full sm:w-auto">
                            <i class="fa-solid fa-arrow-left"></i>
                            <span>Anterior</span>
                        </button>
                        <button type="button"
                            th:unless="${quizSession.currentQuestionIndex > 0}"
                            disabled
                            class="btn btn-disabled opacity-40 gap-2 w-full sm:w-auto cursor-not-allowed">
                            <i class="fa-solid fa-arrow-left"></i>
                            <span>Anterior</span>
                        </button>

                        <!-- Indicador estado pregunta -->
                        <div class="text-sm font-medium opacity-70 flex items-center gap-2">
                            <span th:if="${selectedOptionId != null}" class="badge badge-success badge-sm gap-1 text-white">
                                <i class="fa-solid fa-check text-[10px]"></i> Respondida
                            </span>
                            <span th:unless="${selectedOptionId != null}" class="badge badge-neutral badge-sm gap-1">
                                <i class="fa-solid fa-pencil text-[10px]"></i> Pendiente
                            </span>
                        </div>

                        <!-- Botón Siguiente -->
                        <button type="button"
                            th:if="${quizSession.currentQuestionIndex < quizSession.maxReachedQuestionIndex}"
                            th:hx-post="@{/cuestionarios/{slug}/navigate(slug=${quizSession.slug}, targetIndex=${quizSession.currentQuestionIndex + 1})}"
                            hx-target="#quiz-content" hx-swap="outerHTML"
                            class="btn btn-outline gap-2 w-full sm:w-auto">
                            <span>Siguiente</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                        <button type="button"
                            th:unless="${quizSession.currentQuestionIndex < quizSession.maxReachedQuestionIndex}"
                            disabled
                            title="Responde la pregunta actual para continuar"
                            class="btn btn-disabled opacity-40 gap-2 w-full sm:w-auto cursor-not-allowed">
                            <span>Siguiente</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
        
                </div>
            </div>
        </div>
    </main>
</body>
</html>
