<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" th:replace="~{layout/quiz_layout :: layout(~{::main})}">
<head th:replace="~{fragments/head :: head('Quizly')}"></head>
<body>
    <main th:fragment="main" class="w-full px-6 py-8">
        <!-- Cabecera -->
        <div class="mb-8">
            <div class="card bg-accent-blue-muted! flex flex-col gap-6 md:flex-row md:items-start md:justify-between">
                <div>
                    <!-- <h1 class="text-3xl font-bold" th:text="${quiz.titulo}"></h1> -->

                    <div class="mt-4 flex flex-wrap gap-10">
                        <div>
                            <i class="fa-solid fa-brain text-blue-500"></i>
                            <span class="font-bold">Tema:</span>
                            <span th:text="${quiz.tema}"></span>
                        </div>
                        <p>
                            <span class="font-bold">Dificultad:</span>
                            <span th:text="${quiz.dificultad}"></span>
                        </p>
                    </div>
                </div>

                <div class="text-right">
                    <p class="text-sm opacity-70">Pregunta</p>
                    <p class="text-4xl font-bold">
                        <span th:text="${quiz.currentQuestionIndex + 1}"></span>
                        <span class="opacity-40">/</span>
                        <span th:text="${quiz.preguntas.size()}"></span>
                    </p>
                </div>
            </div>

            <progress class="progress progress-primary mt-6 w-full" th:value="${quiz.progress}" max="100"></progress>
        </div>

        <!-- Tarjeta -->
        <div id="question-card" th:fragment="question-card" class="card bg-base-100 shadow-xl border border-base-300">
        
            <div class="card-body p-8">
                <h2 class="text-2xl font-semibold leading-relaxed" th:text="${question.statement}"></h2>
        
                <form id="answer-form" th:action="@{/cuestionarios/{slug}/answer(slug=${quiz.slug})}"
                    th:hx-post="@{/cuestionarios/{slug}/answer(slug=${quiz.slug})}" hx-trigger="change"
                    hx-target="#question-card" hx-swap="outerHTML" class="mt-8 space-y-4">

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        
                    <label th:each="option,iter : ${question.options}" class="block cursor-pointer">
                        <input type="radio" name="optionId" th:value="${option.id}" class="peer sr-only" required />
        
                        <div class="rounded-xl border border-base-300 bg-base-100 p-5 transition-all duration-200 hover:border-primary
                            hover:bg-primary/5 peer-checked:border-primary peer-checked:bg-primary/10
                            peer-checked:ring-2 peer-checked:ring-primary">
        
                            <div class="flex gap-4">
        
                                <div class="flex h-10 w-10 items-center justify-center rounded-full bg-base-200 font-bold">
        
                                    <span th:text="${#strings.arraySplit('A,B,C,D,E,F', ',')[iter.index]}"></span>
        
                                </div>
        
                                <div class="flex-1">
                                    <p class="leading-relaxed" th:text="${option.text}"></p>
                                </div>
                            </div>
                        </div>
                    </label>
                </form>
    
            </div>
        </div>
    </main>
</body>
</html>
