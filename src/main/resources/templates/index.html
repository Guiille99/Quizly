<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" th:replace="~{layout/base_layout :: layout(~{::main})}">
<head th:replace="~{fragments/head :: head('Quizly')}"></head>
<body>
  <main th:fragment="main" class="w-full px-6 py-8">
    <div class="mb-5">
      <h1 class="text-xl font-semibold tracking-tight text-text">
        <span th:text="${currentUser != null and currentUser.genero.codigo == 'F' ? 'Bienvenida' : 'Bienvenido'} + ', '"></span>
        <span th:if="${currentUser != null}" th:text="${currentUser.nombre}"></span>
      </h1>
      <p class="mt-1 text-sm text-text-muted">Aquí tienes un resumen de tu actividad de hoy</p>
    </div>

    <div class="stats__container w-full mb-5">
      <div class="card stat-card flex-1">
        <span class="stat-number blue" th:text="${nCuestionariosCompletados}"></span>
        <p class="stat-text">Cuestionarios completados</p>
      </div>
      <div class="card stat-card flex-1">
        <span class="stat-number green" th:text="${puntuacionMedia} + '%'"></span>
        <p class="stat-text">Puntuación media</p>
      </div>
      <div class="card stat-card flex-1">
        <span class="stat-number orange" th:text="${nAsignaturasActivas}">0</span>
        <p class="stat-text">Asignaturas activas</p>
      </div>
      <div class="card stat-card flex-1">
        <span class="stat-number purple" th:text="${minutosEstudio}">10</span>
        <p class="stat-text">Minutos de estudio</p>
      </div>
    </div>
