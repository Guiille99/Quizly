<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" th:replace="~{layout/base_layout :: layout(~{::main})}">
<head th:replace="~{fragments/head :: head('Quizly')}"></head>
<body>
  <main th:fragment="main" class="w-full px-6 py-8">
    <div class="mb-5">
      <h1 class="text-xl font-semibold tracking-tight text-text">
        <span th:text="${currentUser != null and currentUser.genero.codigo == 'F' ? 'Bienvenida' : 'Bienvenido'} + ', '"></span>
        <span th:if="${currentUser != null}" th:text="${currentUser.nombre}"></span>
      </h1>
      <p class="mt-1 text-sm text-text-muted">Aquí tienes un resumen de tu actividad de hoy</p>
    </div>

    <div class="stats__container w-full mb-5">
      <div class="card stat-card flex-1">
        <span class="stat-number blue" th:text="${nCuestionariosCompletados}"></span>
        <p class="stat-text">Cuestionarios completados</p>
      </div>
      <div class="card stat-card flex-1">
        <span class="stat-number green" th:text="${puntuacionMedia} + '%'"></span>
        <p class="stat-text">Puntuación media</p>
      </div>
      <div class="card stat-card flex-1">
        <span class="stat-number orange" th:text="${nAsignaturasActivas}">0</span>
        <p class="stat-text">Asignaturas activas</p>
      </div>
      <div class="card stat-card flex-1">
        <span class="stat-number purple" th:text="${minutosEstudio}">10</span>
        <p class="stat-text">Minutos de estudio</p>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
      <div class="lg:col-span-2 card p-6 flex flex-col justify-center border-dashed border-2 border-border/50">
          <p class="text-text-muted italic text-center">Gráfica (Próximamente)</p>
      </div>

      <!-- Actividad reciente -->
      <div class="card">
        <div class="card-body p-0">
          <h3 class="card-title">Actividad reciente</h3>
          <div class="flex flex-col gap-5">
  
            <div th:if="${not #lists.isEmpty(actividades)}" th:each="actividad : ${actividades}" class="flex items-start gap-3">
              <div th:classappend="${actividad.bgColorClass} + ' ' + ${actividad.textColorClass}" 
                   class="icon__container w-8 h-8">
                <i th:if="${actividad.tipo == 'COMPLETADO'}" class="bi bi-check-lg"></i>
                <i th:if="${actividad.tipo == 'RECORD'}" class="bi bi-trophy"></i>
                <i th:if="${actividad.tipo == 'INICIADO'}" class="bi bi-play-fill"></i>
              </div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-medium text-text truncate" th:text="${actividad.titulo}"></p>
                <p class="text-xs text-text-muted" th:text="${actividad.subtitulo}"></p>
              </div>
              <span class="text-[10px] font-bold text-text-muted uppercase whitespace-nowrap pt-1" th:text="${actividad.fechaRelativa}"></span>
            </div>
  
            <div th:if="${#lists.isEmpty(actividades)}">
              <p class="text-text-muted">No hay atividades recientes que mostrar</p>
            </div>
          </div>

        </div>
      </div>

    </div>

  </main>  
</body>
