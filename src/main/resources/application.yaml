spring:
  application:
    name: quizly
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
  thymeleaf:
    cache: false
  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:disabled}
            client-secret: ${GOOGLE_CLIENT_SECRET:disabled}
            scope: openid, profile, email
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 1h
  forward-headers-strategy: NATIVE
ai:
  api-key: ${AI_API_KEY}
  base-url: ${AI_BASE_URL}
  models: ${AI_MODELS}
  cooldown-seconds: ${AI_MODEL_COOLDOWN_SECONDS:60}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:90}
  max-file-size-mb: 20
  context-window-tokens: ${AI_CONTEXT_WINDOW_TOKENS:1000000}
  output-token-reserve: ${AI_OUTPUT_TOKEN_RESERVE:16384}
  context-safety-margin: ${AI_CONTEXT_SAFETY_MARGIN:0.02}
  retry:
    max-attempts: ${AI_RETRY_MAX_ATTEMPTS:3}
    initial-backoff-ms: ${AI_RETRY_INITIAL_BACKOFF_MS:500}
quiz:
  inactivity-max-duration: 1h
  activity-update-interval: 1m
  inactivity-check-cron: 0 0 8 * * *
logging:
  level:
    root: INFO
    '[com.quizly]': INFO
    '[org.springframework]': INFO
    '[org.springframework.security]': INFO
    '[org.hibernate]': WARN

