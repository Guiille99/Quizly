spring:
  application:
    name: quizly
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
  thymeleaf:
    cache: false
  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
server:
  port: 8080
ai:
  api-key: ${AI_API_KEY}
  base-url: ${AI_BASE_URL}
  model: ${AI_MODEL}
  timeout-seconds: 45
  max-pages: 30
  max-file-size-mb: 10
app:
  url: http://localhost:8080
quiz:
  inactivity-max-duration: 1h
  activity-update-interval: 1m
logging:
  level:
    root: INFO
    '[com.quizly]': INFO
    '[org.springframework]': INFO
    '[org.springframework.security]': INFO
    '[org.hibernate]': WARN

