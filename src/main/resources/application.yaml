spring:
  application:
    name: quizly
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
  thymeleaf:
    cache: false
  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB
server:
  port: ${PORT:8080}
  forward-headers-strategy: NATIVE
ai:
  api-key: ${AI_API_KEY}
  base-url: ${AI_BASE_URL}
  model: ${AI_MODEL}
  timeout-seconds: 45
  max-pages: 30
  max-file-size-mb: 20
quiz:
  inactivity-max-duration: 1h
  activity-update-interval: 1m
logging:
  level:
    root: INFO
    '[com.quizly]': INFO
    '[org.springframework]': INFO
    '[org.springframework.security]': INFO
    '[org.hibernate]': WARN

