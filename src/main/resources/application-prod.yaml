spring:
  datasource:
    hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  thymeleaf:
    cache: true
  mail:
    host: ${EMAIL_HOST}
    port: ${EMAIL_PORT}
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
email:
  gmail:
    refresh-token: ${GMAIL_REFRESH_TOKEN:}
server:
  forward-headers-strategy: FRAMEWORK
  servlet:
    session:
      cookie:
        secure: true
logging:
  level:
    root: INFO
    '[com.quizly]': INFO
    '[org.springframework]': INFO
    '[org.springframework.security]': INFO
    '[org.hibernate]': WARN
